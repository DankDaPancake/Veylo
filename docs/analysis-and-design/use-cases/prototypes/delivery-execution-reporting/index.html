<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veylo — PA3 Apple Liquid Glass Prototype Kit (BOOYAH-25)</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="kit.css" />
  <link rel="stylesheet" href="walkthrough.css" />
</head>
<body class="gallery-mode">
  <header class="preview-toolbar" role="banner">
    <div class="preview-brand">
      <span class="preview-brand-mark" aria-hidden="true">V</span>
      <div>
        <div class="preview-brand-title">Veylo · PA3 Liquid Glass Prototype Kit (BOOYAH-25)</div>
        <div class="preview-brand-sub">Apple-Inspired Neutral Crystal Glass + Minimal Emerald Accent · Synthetic examples</div>
      </div>
    </div>

    <nav class="screen-tabs" aria-label="Prototype screens">
      <button type="button" class="screen-tab" data-screen="S00-kit" aria-selected="false">S00 · Kit</button>
      <button type="button" class="screen-tab" data-screen="S07-01" aria-selected="true">S07-01 · Orders</button>
      <button type="button" class="screen-tab" data-screen="S07-01-min" aria-selected="false">S07-01-min · 1280×720</button>
      <button type="button" class="screen-tab" data-screen="S05-01-error" aria-selected="false">S05-01-error</button>
      <button type="button" class="screen-tab" data-screen="S07-01-empty" aria-selected="false">S07-01-empty</button>
      <button type="button" class="screen-tab" data-screen="S07-01-denied" aria-selected="false">S07-01-denied</button>
      <button type="button" class="screen-tab" data-screen="S11-01" aria-selected="false">S11-01 · Rider Mobile</button>
    </nav>

    <div class="preview-controls">
      <span class="viewport-pill" id="viewport-badge">1440 × 900</span>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
        <span id="theme-icon" aria-hidden="true"></span>
        <span id="theme-label">Theme: Light Glass</span>
      </button>
    </div>
  </header>

  <main class="stage-wrapper">
    <div class="stage-meta">
      <label for="walkthrough-frame">BOOYAH-14 walkthrough screen</label>
      <select id="walkthrough-frame" class="input-glass"></select>
      <span id="screen-caption">S07-01 · Orders / normal — Hub Dispatcher desktop console</span>
      <span>Frameless export URL: <code>?screen=S07-01&amp;theme=light|dark&amp;standalone=1</code></span>
    </div>
    <div class="stage-frame" id="stage-frame"></div>
  </main>

  <script src="report.js"></script>
  <script src="frames.js"></script>
  <script src="walkthrough.js"></script>
  <script>
    const ICONS = {

      package: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>`,
      calendar: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>`,
      route: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>`,

      barChart: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>`,
      plus: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`,
      upload: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>`,
      search: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
      clock: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
      check: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`,
      alert: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>`,
      shieldAlert: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>`,
      bookOpen: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>`,
      arrowRight: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`,
      arrowLeft: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`,
      sun: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`,
      moon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`
    };

    /* Neutral urban OSM-style vector backdrop with multi-tone landmarks so pure white/graphite glass refracts crisply */
    const MAP_BACKDROP_SVG = `

        <path d="M-40 240 C 260 205, 510 340, 810 270 S 1220 150, 1500 225" stroke="rgba(56, 189, 248, 0.30)" stroke-width="34" stroke-linecap="round"/>
        <path d="M140 -40 L 250 940 M 490 -40 L 430 940 M 880 -40 L 940 940 M 1210 -40 L 1140 940" stroke="rgba(100, 116, 139, 0.14)" stroke-width="10"/>
        <path d="M-40 430 L 1480 390 M -40 620 L 1480 590 M -40 120 L 1480 150 M -40 790 L 1480 760" stroke="rgba(100, 116, 139, 0.12)" stroke-width="8"/>
        <rect x="530" y="455" width="210" height="105" rx="22" fill="rgba(16, 185, 129, 0.10)" />
        <rect x="975" y="190" width="160" height="145" rx="24" fill="rgba(99, 102, 241, 0.10)" />
        <rect x="65" y="460" width="150" height="125" rx="22" fill="rgba(245, 158, 11, 0.10)" />
        <path d="M210 310 C 420 385, 650 475, 865 415 S 1160 515, 1310 435" stroke="rgba(14, 165, 233, 0.45)" stroke-width="3.5" stroke-dasharray="10 8"/>
        <circle cx="210" cy="310" r="10" fill="rgba(16, 185, 129, 0.60)"/>
        <circle cx="865" cy="415" r="10" fill="rgba(245, 158, 11, 0.62)"/>
        <circle cx="1310" cy="435" r="11" fill="rgba(14, 165, 233, 0.62)"/>
      </svg>
    `;

    function renderSidebar(activeNav = "Orders") {
      const items = [
        { label: "Orders", icon: ICONS.package },
        { label: "Shifts", icon: ICONS.calendar },
        { label: "Delivery attempts", icon: ICONS.route },
        { label: "Location guides", icon: ICONS.mapPin },
        { label: "Reports", icon: ICONS.barChart }
      ];
      return `
        <div class="sidebar-wrap">
          <aside class="sidebar glass-chrome" aria-label="Dispatcher navigation">
            <div class="sidebar-brand">
              <div class="brand-lockup">
                <span class="brand-logo">${ICONS.truck}</span>
                <div>
                  <div class="brand-name">Veylo</div>
                  <div class="brand-role">Dispatcher</div>
                </div>
              </div>
            </div>
            <div class="hub-chip">
              <span class="hub-dot" aria-hidden="true"></span>
              <span>Hub Q1 · Synthetic</span>
            </div>
            <ul class="nav-list">
              ${items
                .map(
                  (item) => `
                <li>
                  <a href="#${item.label.toLowerCase().replace(/\s+/g, "-")}" class="nav-item ${
                    item.label === activeNav ? "nav-item--active" : ""
                  }" ${item.label === activeNav ? 'aria-current="page"' : ""}>
                    ${item.icon}
                    <span>${item.label}</span>
                  </a>
                </li>`
                )
                .join("")}
            </ul>
            <div class="sidebar-footer">
              <span class="avatar-glass" aria-hidden="true">DP</span>
              <div>
                <div style="font-weight:700;color:var(--text-primary);">Dispatcher Demo</div>
                <div>Role: Hub Dispatcher</div>
              </div>
            </div>
          </aside>
        </div>
      `;
    }

    function renderDesktopShell(innerHtml, sizeClass = "veylo-canvas--desktop", activeNav = "Orders") {
      return `
        <section class="veylo-canvas ${sizeClass}">
          ${MAP_BACKDROP_SVG}
          <div class="app-shell">
            ${renderSidebar(activeNav)}
            <div class="workspace">
              ${innerHtml}
              <footer class="workspace-footer">
                <span>BOOYAH-25 · Apple Liquid Glass Shared Prototype Kit</span>
                <span>Synthetic examples, not implemented workflows</span>
              </footer>
            </div>
          </div>
        </section>
      `;
    }

    const SCREENS = {
      "S00-kit": {
        viewport: "1440 × 900",
        caption: "S00 · Shared Liquid Glass Component Kit — Neutral Crystal Glass + Minimal Emerald Accent",
        render: () => `
          <section class="veylo-canvas veylo-canvas--desktop">
            ${MAP_BACKDROP_SVG}
            <div class="kit-sheet">
              <div class="page-header" style="margin-bottom:2px;">
                <div>
                  <p class="eyebrow">BOOYAH-25 · APPLE LIQUID GLASS SPECIFICATION</p>
                  <h1 class="page-title">Veylo Glassmorphism Prototype Kit</h1>
                  <p class="page-subtitle">Achromatic frosted crystal surfaces with minimal emerald accents for Desktop (≥1280×720) &amp; Mobile (360×800).</p>

              </div>

              <div class="kit-grid">
                <article class="glass-panel kit-card">
                  <h2 class="kit-card-title">1. Optical Glass Tiers</h2>
                  <div class="glass-chrome" style="padding:12px 14px;border-radius:14px;">
                    <div style="font-weight:700;font-size:13px;">Chrome Rail · High Translucency</div>
                    <div class="tabular" style="font-size:12px;color:var(--text-secondary);">blur(34px) saturate(195%) · 0.44 alpha</div>
                  </div>
                  <div class="glass-panel" style="padding:12px 14px;border-radius:14px;">
                    <div style="font-weight:700;font-size:13px;">Workspace Glass · Data Layer</div>
                    <div class="tabular" style="font-size:12px;color:var(--text-secondary);">blur(36px) saturate(190%) · 0.56 alpha</div>

                    <div class="tabular" style="font-size:12px;color:var(--text-secondary);">blur(42px) saturate(200%) · 0.68 alpha</div>
                  </div>

                <article class="glass-panel kit-card">
                  <h2 class="kit-card-title">2. Neutral Ink + Judicious Color</h2>

                </article>

                    <button type="button" class="btn btn--primary">${ICONS.plus} Create order</button>
                    <button type="button" class="btn btn--glass">${ICONS.upload} Import CSV</button>

                  <div class="field-group" style="margin-bottom:0;margin-top:4px;">

                  </div>
                </article>
              </div>

              <div class="kit-grid" style="grid-template-columns: 1.45fr 1fr;">
                <article class="glass-panel kit-card">
                  <h2 class="kit-card-title">4. Spatial Typography &amp; Figure-Ground Separation</h2>
                  <p style="margin:0;font-size:14px;color:var(--text-secondary);">
                    Neutral crystal glass eliminates color fatigue across 8-hour dispatcher shifts while letting <strong>tabular order codes</strong>, <strong>time windows</strong>, and <strong>Location Guide status</strong> pop cleanly.
                  </p>
                  <div class="glass-subtle" style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;">
                    <div>
                      <span class="order-id">VL-0001</span> · <strong style="font-size:14px;">Sample recipient 1</strong>
                      <div class="order-address">12 Sample Street, Ward 5 (Synthetic)</div>
                    </div>
                    <span class="tabular" style="font-size:13px;font-weight:600;">09:00–11:00</span>
                    <span class="badge badge--success">${ICONS.bookOpen} Verified guide</span>
                    <span class="badge badge--pending">${ICONS.clock} Pending</span>

                    <li><strong class="tabular">S07-01-min</strong> · Minimum desktop (1280×720)</li>

                    <li><strong class="tabular">S11-01</strong> · Rider mobile thumb-dock (360×800)</li>
                  </ul>
                </article>
              </div>
            </div>
          </section>
        `
      },

      "S07-01": {

        caption: "S07-01 · Orders / normal — Floating Apple Liquid Glass console (1440×900)",
        render: () =>
          renderDesktopShell(`
            <header class="page-header">

                    <td><span class="badge badge--pending">${ICONS.clock} Pending</span></td>
                  </tr>
                  <tr>
                    <td>
                      <div class="order-main">
                        <div class="order-title-row">
                          <span class="order-id">VL-0003</span>

                        </div>

    for (const [id, frame] of Object.entries(BOOYAH_FRAMES)) {
      const rider = /^S1[12]/.test(id);
      const minimum = id.endsWith("-min");
      SCREENS[id] = {
        viewport: rider ? "360 × 800" : minimum ? "1280 × 720" : "1440 × 900",
        caption: `${id} · ${frame.title}`,
        render: () => renderWalkthrough(id, frame, renderDesktopShell),
      };
    }

    const params = new URLSearchParams(window.location.search);
    let currentScreen = Object.hasOwn(SCREENS, params.get("screen")) ? params.get("screen") : WORK;
    let currentTheme = params.get("theme") === "dark" ? "dark" : "light";
    const isStandalone = params.get("standalone") === "1";

    if (isStandalone) {
      document.body.classList.remove("gallery-mode");
      document.body.classList.add("standalone-mode");
    }

    const stageFrame = document.getElementById("stage-frame");
    const viewportBadge = document.getElementById("viewport-badge");
    const screenCaption = document.getElementById("screen-caption");
    const themeToggle = document.getElementById("theme-toggle");
    const themeLabel = document.getElementById("theme-label");
    const themeIcon = document.getElementById("theme-icon");
    const walkthroughFrame = document.getElementById("walkthrough-frame");
    for (const [id, frame] of Object.entries(BOOYAH_FRAMES)) {
      walkthroughFrame.add(new Option(`${id} · ${frame.title}`, id));
    }
    walkthroughFrame.addEventListener("change", () => {
      currentScreen = walkthroughFrame.value;
      render();
    });
    stageFrame.addEventListener("submit", handleSimulation);

    function render() {
      document.documentElement.setAttribute("data-theme", currentTheme);
      const spec = SCREENS[currentScreen];
      stageFrame.innerHTML = spec.render();
      stageFrame.dataset.renderedScreen = currentScreen;
      restoreFilters(stageFrame);
      walkthroughFrame.value = Object.hasOwn(BOOYAH_FRAMES, currentScreen) ? currentScreen : "";
      viewportBadge.textContent = spec.viewport;
      screenCaption.textContent = spec.caption;

      const isDark = currentTheme === "dark";
      themeToggle.setAttribute("aria-pressed", String(isDark));
      themeLabel.textContent = isDark ? "Theme: Dark Glass" : "Theme: Light Glass";
      themeIcon.innerHTML = isDark ? ICONS.moon : ICONS.sun;

      document.querySelectorAll(".screen-tab").forEach((btn) => {
        btn.setAttribute("aria-selected", String(btn.dataset.screen === currentScreen));
      });
    }

    document.querySelectorAll(".screen-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentScreen = btn.dataset.screen;
        render();
      });
    });

    themeToggle.addEventListener("click", () => {
      currentTheme = currentTheme === "light" ? "dark" : "light";
      render();
    });

    render();
  </script>
