<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-1-title workflow-1-desc" id="workflow-1-root">
        <title id="workflow-1-title">Order Dispatch and Delivery Execution</title>
        <desc id="workflow-1-desc">Swimlane workflow showing orders validated by the system, assigned to shifts by the dispatcher, executed by the rider, and resolved through re-dispatch or reporting.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #workflow-1-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #workflow-1-root { font-family: var(--font-sans); color: var(--color-ink); }
      #workflow-1-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#workflow-1-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="workflow-1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="workflow-1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="workflow-1-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lane structure (3 horizontal lanes) -->
        <line x1="40" y1="64" x2="1240" y2="64" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="40" y1="248" x2="1240" y2="248" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <line x1="40" y1="432" x2="1240" y2="432" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <line x1="40" y1="600" x2="1240" y2="600" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="144" y1="64" x2="144" y2="600" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>

        <!-- Lane labels -->
        <text x="56" y="160" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">DISPATCHER</text>
        <text x="56" y="344" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">SYSTEM</text>
        <text x="56" y="520" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">RIDER</text>

        <!-- Connectors (drawn before boxes) -->
        <!-- 1. Order Intake -> Validate & Persist (SUBMIT) -->
        <line x1="216" y1="192" x2="216" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-1-arrow)"/>

        <!-- 2. Validate & Persist -> Order Intake (INVALID loop) -->
        <line x1="272" y1="312" x2="272" y2="192" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#workflow-1-arrow)"/>

        <!-- 3. Validate & Persist -> Assign Shift (VALID) -->
        <path d="M 328,340 H 360 Q 368,340 368,332 V 172 Q 368,164 376,164 H 416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-1-arrow)"/>

        <!-- 4. Assign Shift -> Publish & Suggest (PUBLISH) -->
        <line x1="504" y1="192" x2="504" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-1-arrow)"/>

        <!-- 5. Publish & Suggest -> Review Assigned Shift (SHIFT LIST) -->
        <line x1="504" y1="368" x2="504" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-1-arrow)"/>

        <!-- 6. Review Assigned Shift -> Execute Attempt (NEXT STOP) -->
        <line x1="560" y1="516" x2="648" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-1-arrow)"/>

        <!-- 7. Execute Attempt -> Record Outcome (POD / FAIL) -->
        <path d="M 816,516 H 896 Q 904,516 904,508 V 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-1-arrow)"/>

        <!-- 8. Record Outcome -> Publish & Suggest (MORE STOPS loop) -->
        <line x1="816" y1="340" x2="592" y2="340" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#workflow-1-arrow)"/>

        <!-- 9. Record Outcome -> Inspect & Resolve (PROGRESS - coral focal) -->
        <line x1="904" y1="312" x2="904" y2="192" stroke="#bf4520" stroke-width="1.4" marker-end="url(#workflow-1-arrow-accent)"/>

        <!-- 10. Inspect & Resolve -> Assign Shift (RE-DISPATCH loop above Dispatcher nodes) -->
        <path d="M 904,136 V 100 Q 904,92 896,92 H 512 Q 504,92 504,100 V 136" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#workflow-1-arrow)"/>

        <!-- 11. Inspect & Resolve -> Shift Reports (TERMINAL) -->
        <line x1="992" y1="164" x2="1064" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-1-arrow)"/>

        <!-- Arrow labels (opaque mask with >=6px clearance from stroke) -->
        <rect x="160" y="216" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="184" y="225" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>

        <rect x="280" y="272" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306" y="281" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INVALID</text>

        <rect x="376" y="216" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="396" y="225" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VALID</text>

        <rect x="512" y="216" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="538" y="225" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>

        <rect x="512" y="400" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="548" y="409" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SHIFT LIST</text>

        <rect x="568" y="496" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="505" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEXT STOP</text>

        <rect x="912" y="444" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="946" y="453" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POD / FAIL</text>

        <rect x="668" y="320" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="329" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MORE STOPS</text>

        <rect x="912" y="216" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="944" y="225" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROGRESS</text>

        <rect x="664" y="72" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="81" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RE-DISPATCH</text>

        <rect x="996" y="144" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1028" y="153" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TERMINAL</text>

        <!-- Nodes -->
        <!-- Dispatcher 1: Order Intake (input) -->
        <rect x="160" y="136" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="136" width="168" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="244" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Order Intake</text>
        <text x="244" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">manual · CSV import</text>

        <!-- Dispatcher 2: Assign Shift (step) -->
        <rect x="416" y="136" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="504" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Assign Shift</text>
        <text x="504" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">batch orders · rider</text>

        <!-- Dispatcher 3: Inspect & Resolve (focal coral) -->
        <rect x="816" y="136" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="816" y="136" width="176" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="904" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Inspect &amp; Resolve</text>
        <text x="904" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">retry policy check</text>

        <!-- Dispatcher 4: Shift Reports (step) -->
        <rect x="1064" y="136" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1140" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Shift Reports</text>
        <text x="1140" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">shift completed</text>

        <!-- System 1: Validate & Persist (store) -->
        <rect x="160" y="312" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="312" width="168" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="244" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Validate &amp; Persist</text>
        <text x="244" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PostgreSQL · orders</text>

        <!-- System 2: Publish & Suggest (step) -->
        <rect x="416" y="312" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="504" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Publish &amp; Suggest</text>
        <text x="504" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">next stop · guide preview</text>

        <!-- System 3: Record Outcome (store) -->
        <rect x="816" y="312" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="816" y="312" width="176" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="904" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Record Outcome</text>
        <text x="904" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POD photo · fail reason</text>

        <!-- Rider 1: Review Assigned Shift (step) -->
        <rect x="416" y="488" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="488" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Review Shift</text>
        <text x="488" y="528" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mobile web · stop list</text>

        <!-- Rider 2: Execute Attempt (step) -->
        <rect x="648" y="488" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="732" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Execute Attempt</text>
        <text x="732" y="528" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">arrive · capture result</text>

        <!-- Legend strip -->
        <line x1="40" y1="632" x2="1240" y2="632" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="668" width="16" height="12" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="64" y="677" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Input</text>

        <rect x="136" y="668" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="677" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Action step</text>

        <rect x="268" y="668" width="16" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="292" y="677" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">System store</text>

        <rect x="412" y="668" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="436" y="677" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Focal decision</text>

        <line x1="564" y1="674" x2="596" y2="674" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-1-arrow)"/>
        <text x="604" y="677" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Primary flow</text>

        <line x1="716" y1="674" x2="748" y2="674" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#workflow-1-arrow)"/>
        <text x="756" y="677" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Retry / next-stop loop</text>

        <line x1="916" y1="674" x2="948" y2="674" stroke="#bf4520" stroke-width="1.4" marker-end="url(#workflow-1-arrow-accent)"/>
        <text x="956" y="677" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Resolution handoff</text>
      </svg>
